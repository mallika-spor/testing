<!DOCTYPE html>
<html>
<head>
  <title>My First Website</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 100px;
      background: #f4f4f4;
    }

    h1 {
      color: #333;
    }

    p {
      color: #666;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: blue;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: darkblue;
    }
  </style>
</head>

<body>

  <h1>Hello World 🚀</h1>

  <p>This website is hosted free on GitHub Pages.</p>

  <button onclick="showMessage()">
    Click Me
  </button>

  <script>
    function showMessage() {
      alert("Your website works!");
    }
  </script>

</body>
</html>
